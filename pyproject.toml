
content = """[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "javan-marketing-agent"
version = "0.1.0"
description = "AI-powered marketing and lead generation agent"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.5,<3.0",
    "httpx>=0.27,<1.0",
    "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "ruff>=0.6,<1.0",
    "mypy>=1.13,<2.0",
]

[project.scripts]
javan-agent = "javan_agent.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/javan_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
"""
path = "/mnt/data/pyproject.toml"
with open(path, "w", encoding="utf-8") as f:
    f.write(content)
print(path)
